name: pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - "mygo.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued one replaces the last: a page that is
# already out of date is not worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the gallery for the web
        run: go run github.com/egoist/mygo/cmd/mygo build -platform web

      - name: Assemble the site
        run: |
          cd dist/web
          # One wasm per build, named by its content: the page asks for app.wasm.
          mv ./*.wasm app.wasm
          cp ../../web/index.html index.html
          ls -la

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
