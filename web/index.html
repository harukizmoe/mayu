<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mayu — Material 3 for MyGo</title>
    <meta
      name="description"
      content="Mayu is a Material Design 3 component library for MyGo's native GPU UI, in pure Go. This is the gallery itself, the same Go code compiled to WebAssembly."
    />
    <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236750A4'/%3E%3Cpath d='M9 22V10h4l3 6 3-6h4v12h-3v-7l-2.5 5h-3L12 15v7z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fef7ff;
        --fg: #1d1b20;
        --muted: #49454f;
        --accent: #6750a4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141218;
          --fg: #e6e0e9;
          --muted: #cac4d0;
          --accent: #d0bcff;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
      /* The app's window is fixed over the page, so this is what a visitor
         sees until the first frame: the app then paints over it. */
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        color: var(--muted);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #loading h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.02em;
        color: var(--fg);
      }
      #loading p {
        margin: 0;
        max-width: 34ch;
        text-align: center;
      }
      #loading a {
        color: var(--accent);
      }
      .spinner {
        width: 24px;
        height: 24px;
        animation: spin 1s steps(12) infinite;
      }
      .spinner line {
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #error {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: auto;
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        white-space: pre-wrap;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Mayu</h1>
      <svg class="spinner" viewBox="0 0 24 24" role="progressbar" aria-label="Loading">
        <g transform="translate(12 12)">
          <line y1="-5.5" y2="-10" opacity="1.00" transform="rotate(0)" />
          <line y1="-5.5" y2="-10" opacity="0.92" transform="rotate(-30)" />
          <line y1="-5.5" y2="-10" opacity="0.84" transform="rotate(-60)" />
          <line y1="-5.5" y2="-10" opacity="0.76" transform="rotate(-90)" />
          <line y1="-5.5" y2="-10" opacity="0.68" transform="rotate(-120)" />
          <line y1="-5.5" y2="-10" opacity="0.60" transform="rotate(-150)" />
          <line y1="-5.5" y2="-10" opacity="0.52" transform="rotate(-180)" />
          <line y1="-5.5" y2="-10" opacity="0.44" transform="rotate(-210)" />
          <line y1="-5.5" y2="-10" opacity="0.36" transform="rotate(-240)" />
          <line y1="-5.5" y2="-10" opacity="0.28" transform="rotate(-270)" />
          <line y1="-5.5" y2="-10" opacity="0.20" transform="rotate(-300)" />
          <line y1="-5.5" y2="-10" opacity="0.20" transform="rotate(-330)" />
        </g>
      </svg>
      <p>
        Loading the gallery, the whole component library compiled to WebAssembly.
        It is what
        <a href="https://github.com/harukizmoe/mayu">github.com/harukizmoe/mayu</a>
        builds, so it cannot drift from the library.
      </p>
    </div>

    <script src="wasm_exec.js"></script>
    <script>
      // The gallery, built by `mygo build -platform web`: the same Go code as
      // the desktop app, drawing to a canvas through WebGL.
      const go = new Go();
      const app = document.createElement("p");
      app.id = "error";
      WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject)
        .then((r) => go.run(r.instance))
        .catch((e) => {
          app.textContent = "The gallery did not load: " + e;
          document.body.replaceChildren(app);
        });
    </script>
  </body>
</html>
